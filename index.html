<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>Ilustraciones, IA y absurdos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#000;scrollbar-width:thin;scrollbar-color:#333 #000}
  body{background:#000;color:#e6e6e6;font-family:Georgia,"Times New Roman",serif;padding:clamp(1rem,4vw,3rem) clamp(.6rem,3vw,3rem) 6rem}
  .head{text-align:center;margin:1rem 0 clamp(2rem,6vw,4rem)}
  .head h1{font-weight:400;font-size:clamp(1.3rem,3.2vw,2.2rem);letter-spacing:.05em;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.55),0 0 30px rgba(255,255,255,.25)}
  .piece{display:flex;justify-content:center;margin:0 auto clamp(2.5rem,8vw,6rem);transition:opacity 1.2s ease,transform 1.2s ease}
  .js .piece:not(.in){opacity:0;transform:translateY(14px)}
  .piece img{display:block;max-width:100%;height:auto;max-height:92vh;max-height:92dvh;width:auto;object-fit:contain}
  .back{position:fixed;left:max(1rem,env(safe-area-inset-left));bottom:max(1rem,env(safe-area-inset-bottom));color:#e6e6e6;text-decoration:none;font-size:.9rem;letter-spacing:.08em;text-shadow:0 0 6px rgba(255,255,255,.5),0 0 16px rgba(255,255,255,.25);background:rgba(0,0,0,.55);padding:.35rem .7rem;border-radius:2px;opacity:.75;transition:opacity .3s ease,text-shadow .3s ease;z-index:5}
  .back:hover,.back:focus-visible{opacity:1;color:#fff;text-shadow:0 0 10px rgba(255,255,255,.9),0 0 26px rgba(255,255,255,.5);outline:none}
  @media (prefers-reduced-motion:reduce){.piece,.js .piece:not(.in){transition:none;opacity:1;transform:none}.back{transition:none}}
</style>
</head>
<body>
<header class="head"><h1>Ilustraciones, IA y absurdos</h1></header>
<main>
  <figure class="piece">
    <img src="img/ilustracion-1.jpg" loading="eager" decoding="async" alt="Mujer arrodillada que reza ante una vela y un esqueleto con guadaña, dentro de un círculo graduado como un reloj; cuadrados pixelados flotan en el fondo negro." width="1920" height="1262" loading="lazy">
  </figure>
  <figure class="piece">
    <img src="img/ilustracion-2.jpg" loading="eager" decoding="async" alt="Dibujo a grafito de un bosque inquietante: un árbol con torso de mujer y una rama que atraviesa el pecho de una figura que grita." width="1486" height="1920" loading="lazy">
  </figure>
  <figure class="piece">
    <img src="img/ilustracion-3.jpg" loading="eager" decoding="async" alt="Un sapo verde de colmillos bebe un refresco con popote sobre un cielo rosa; el texto «SED» en letras verdes." width="1493" height="1054" loading="lazy">
  </figure>
  <figure class="piece">
    <img src="img/ilustracion-4.jpg" loading="eager" decoding="async" alt="Una puerta en arco abre a un campo amarillo; flores con rostros humanos gritan en primer plano." width="1086" height="1448" loading="lazy">
  </figure>
  <figure class="piece">
    <img src="img/ilustracion-5.jpg" loading="eager" decoding="async" alt="Dibujo de dos seres alados peludos que se acercan: uno vuela con alas de insecto, el otro tiene tentáculos en espiral." width="1017" height="1017" loading="lazy">
  </figure>
  <figure class="piece">
    <img src="img/ilustracion-6.jpg" loading="eager" decoding="async" alt="Escritorio retro en tonos violeta con una mujer que riega flores de datos con una regadera que dice PROMPT, ventanas de error y código." width="1672" height="941" loading="lazy">
  </figure>
</main>
<a class="back" href="https://metafobian-code.github.io/metafobia/#ilustraciones-ia-y-absurdos">← Metafobia</a>
<script>
  (function () {
    var els = document.querySelectorAll(".piece");
    var show = function (el) { el.classList.add("in"); };
    try {
      if ("IntersectionObserver" in window) {
        document.documentElement.classList.add("js");
        var io = new IntersectionObserver(function (es) {
          es.forEach(function (e) { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });
        }, { threshold: 0 });
        els.forEach(function (el) { io.observe(el); });
        // red de seguridad: pase lo que pase, todo se muestra
        setTimeout(function () { els.forEach(show); }, 2500);
      } else { els.forEach(show); }
    } catch (err) { els.forEach(show); }
  })();
</script>
</body>
</html>
